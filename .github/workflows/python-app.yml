name: CI/CD

on:
  push:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  checks:
    name: Lint and Build Tests
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: [ "3.11", "3.12", "3.13", "3.14" ]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Lint with Ruff
        uses: astral-sh/ruff-action@v3
        with:
          version: "latest"

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Build
        run: uv build

      - name: Install Qt system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1

      - name: Smoke test (wheel)
        run: uv run --isolated --no-project --with dist/*.whl tests/smoke_test.py

      - name: Smoke test (source distribution)
        run: uv run --isolated --no-project --with dist/*.tar.gz tests/smoke_test.py


  build-docs:
    name: Build Docs
    needs: checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Generate documentation
        run: uv run zensical build --clean

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/


  deploy-docs:
    name: Deploy Docs
    needs: build-docs
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@v5


  create-tag:
    name: Create New Tag
    needs: checks
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    outputs:
      TAG: ${{ steps.version.outputs.TAG }}
      VERSION: ${{ steps.version.outputs.VERSION }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Create initial tag if none exists
        run: |
          if [ -z "$(git tag -l 'v*')" ]; then
            git tag v0.0.0
            git push origin v0.0.0
          fi

      - name: Bump version
        id: bump
        uses: anothrNick/github-tag-action@1.75.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WITH_V: true
          DEFAULT_BUMP: patch

      - name: Export version
        id: version
        run: |
          TAG=${{ steps.bump.outputs.new_tag }}
          VERSION=${TAG#v}

          echo "TAG=$TAG" >> $GITHUB_OUTPUT
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT


  build-artifacts:
    name: Build Artifacts
    needs: [ checks, create-tag ]
    if: |
      always() &&
      needs.checks.result == 'success' &&
      (needs.create-tag.result == 'success' || needs.create-tag.result == 'skipped')
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ windows-latest, ubuntu-22.04 ]

    steps:
      - name: Checkout commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Install PyInstaller and local package
        run: uv sync --no-dev --group install

      - name: Install Qt runtime dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-render-util0 \
            libxcb-xinerama0 \
            libxcb-xkb1 \
            zsync

      - name: Build with PyInstaller
        run: uv run pyinstaller --clean --noconfirm raw2film.spec

      - name: Package binaries
        shell: bash
        run: |
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            mv dist/Raw2Film.exe Raw2Film.exe
          else
            test -x dist/Raw2Film/Raw2Film
            test -d dist/Raw2Film/_internal
            mkdir -p AppDir/usr/bin \
              AppDir/usr/share/applications \
              AppDir/usr/share/metainfo \
              AppDir/usr/share/icons/hicolor/512x512/apps
            cp -a dist/Raw2Film/. AppDir/usr/bin/
            chmod +x AppDir/usr/bin/Raw2Film
            install -Dm755 packaging/appimage/AppRun AppDir/AppRun
            install -Dm644 packaging/appimage/raw2film.desktop \
              AppDir/raw2film.desktop
            install -Dm644 packaging/appimage/raw2film.desktop \
              AppDir/usr/share/applications/raw2film.desktop
            install -Dm644 src/raw2film/resources/raw2film_512.png \
              AppDir/raw2film.png
            install -Dm644 src/raw2film/resources/raw2film_512.png \
              AppDir/usr/share/icons/hicolor/512x512/apps/raw2film.png
            XCB_PLUGIN="AppDir/usr/bin/_internal/PyQt6/Qt6/plugins/platforms/libqxcb.so"
            ldd "$XCB_PLUGIN" \
              | awk '/=> \// { print $3 } /^\/lib/ { print $1 }' \
              | sort -u \
              | while read -r library; do
                  case "$(basename "$library")" in
                    libc.so.*|libm.so.*|libdl.so.*|libpthread.so.*|librt.so.*|libresolv.so.*|libgcc_s.so.*|libstdc++.so.*)
                      continue
                      ;;
                  esac
                  install -Dm755 "$library" \
                    "AppDir/usr/lib/x86_64-linux-gnu/$(basename "$library")"
                done

            wget -q \
              https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage \
              -O appimagetool
            chmod +x appimagetool
            VERSION="${{ needs.create-tag.outputs.VERSION }}"
            if [[ -n "$VERSION" ]]; then
              UPDATE_INFORMATION="zsync|https://github.com/${{ github.repository }}/releases/download/${{ needs.create-tag.outputs.TAG }}/Raw2Film-${VERSION}.AppImage.zsync"
              ARCH=x86_64 ./appimagetool --appimage-extract-and-run \
                --updateinformation "$UPDATE_INFORMATION" \
                AppDir Raw2Film.AppImage
            else
              ARCH=x86_64 ./appimagetool --appimage-extract-and-run \
                AppDir Raw2Film.AppImage
            fi
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: raw2film-${{ matrix.os }}
          path: |
            Raw2Film.exe
            Raw2Film.AppImage


  release:
    name: Create Release
    needs: [ create-tag, build-artifacts ]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-artifacts/
          merge-multiple: true

      - name: Rename artifacts with version
        run: |
          VERSION="${{ needs.create-tag.outputs.VERSION }}"
          cd release-artifacts/
          if [ -f "Raw2Film.exe" ]; then
            mv Raw2Film.exe "Raw2Film-${VERSION}.exe"
          fi
          if [ -f "Raw2Film.AppImage" ]; then
            mv Raw2Film.AppImage "Raw2Film-${VERSION}.AppImage"
          fi
          if [ -f "Raw2Film.AppImage.zsync" ]; then
            mv Raw2Film.AppImage.zsync "Raw2Film-${VERSION}.AppImage.zsync"
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.create-tag.outputs.TAG }}
          name: Version ${{ needs.create-tag.outputs.VERSION }}
          files: |
            release-artifacts/Raw2Film-*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-pypi:
    name: Publish to PyPI
    needs: create-tag
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    environment:
      name: pypi

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.create-tag.outputs.TAG }}
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: 3.14
          enable-cache: true

      - name: Build package
        run: uv build

      - name: Install Qt system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1

      - name: Smoke test (wheel)
        run: uv run --isolated --no-project --with dist/*.whl tests/smoke_test.py

      - name: Smoke test (sdist)
        run: uv run --isolated --no-project --with dist/*.tar.gz tests/smoke_test.py

      - name: Publish to PyPI
        run: uv publish
